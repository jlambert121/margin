<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: markdown-asset:; connect-src 'none'; font-src 'self' data:">
<title>Margin</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
<main>
  <header id="toolbar">
    <div class="toolbar-left"><button id="toggle-sidebar" class="icon-button" title="Toggle sidebar (⇧⌘L)" aria-label="Toggle sidebar"><svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 4v12"/></svg></button><span class="divider"></span><span id="document-name">Untitled.md</span><span id="modified-dot" title="Unsaved changes" hidden>●</span></div>
    <div class="toolbar-right"><button id="format-button" class="icon-button" title="Formatting options" aria-label="Formatting options" aria-expanded="false">Aa</button><button id="source-button" class="icon-button" title="Toggle source mode (⌘/)" aria-label="Toggle source mode" aria-pressed="false">&lt;/&gt;</button><button id="more-button" class="icon-button" title="View options" aria-label="View options" aria-expanded="false">•••</button></div>
  </header>
  <div id="find-bar" hidden><input id="find-input" type="search" placeholder="Find in document…" aria-label="Find in document"><button id="find-regex" title="Match a regular expression" aria-label="Regular expression" aria-pressed="false">.*</button><span id="find-result"></span><button id="find-prev" aria-label="Previous match">↑</button><button id="find-next" aria-label="Next match">↓</button><input id="replace-input" class="replace-control" type="text" placeholder="Replace with…" aria-label="Replace with"><button id="replace-one" class="replace-control">Replace</button><button id="replace-all" class="replace-control">All</button><button id="find-close" aria-label="Close find">×</button></div>
  <div id="goto-bar" hidden><input id="goto-input" type="text" inputmode="numeric" aria-label="Go to line"><span id="goto-result"></span><button id="goto-close" aria-label="Close go to line">×</button></div>
  <div id="disk-banner" class="notice-bar" role="alert" hidden><span class="notice-text">This file changed on disk while you have unsaved changes.</span><button id="disk-reload">Reload</button><button id="disk-keep-mine">Keep mine</button><button id="disk-compare" class="primary">Compare</button></div>
  <div id="compare-bar" class="notice-bar" hidden><span id="compare-status" class="notice-text"></span><button id="compare-use-disk">Use disk version for all</button><button id="compare-keep-mine">Keep mine for all</button><button id="compare-cancel">Cancel</button></div>
  <div id="editor"></div>
  <footer id="statusbar"><span id="save-status">Ready to write</span><div><button id="word-count" title="Document statistics">0 words</button><span id="reading-time">1 min read</span><span class="status-divider"></span><button id="cursor-position" title="Go to line (⌘L)">Ln 1, Col 1</button><span class="status-divider"></span><span>Markdown</span><span class="encoding">UTF-8</span></div></footer>
</main>
</div>
<div id="format-menu" class="popover" hidden><div class="menu-caption">PARAGRAPH</div><button data-format="paragraph">Body text <kbd>⌘0</kbd></button><button data-format="h1">Heading 1 <kbd>⌘1</kbd></button><button data-format="h2">Heading 2 <kbd>⌘2</kbd></button><button data-format="h3">Heading 3 <kbd>⌘3</kbd></button><hr><button data-format="bold"><b>Bold</b> <kbd>⌘B</kbd></button><button data-format="italic"><i>Italic</i> <kbd>⌘I</kbd></button><button data-format="strike">Strikethrough</button><button data-format="code">Inline code</button><hr><button data-format="bulletList">Bullet list</button><button data-format="orderedList">Numbered list</button><button data-format="taskList">Task list</button><button data-format="blockquote">Quote</button><button data-format="codeBlock">Code block</button><button data-format="table">Insert table</button><button data-format="link">Insert link…</button><button data-format="image">Insert image…</button></div>
<div id="view-menu" class="popover" hidden><button id="typewriter-button">Typewriter mode <span id="typewriter-check"></span></button><button data-action="exportHTML">Export HTML…</button><button data-action="print">Print / Save as PDF…</button></div>
<dialog id="insert-dialog"><form method="dialog"><h2 id="insert-title">Insert link</h2><label id="insert-label">URL<input id="insert-url" type="text" required placeholder="https://"></label><label>Description<input id="insert-description" type="text"></label><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button value="insert" class="primary">Insert</button></div></form></dialog>
<div id="toast" role="status" hidden></div>
<article id="print-view" aria-hidden="true"></article>
<script src="src/diagnostics.js"></script>
<script src="vendor/codemirror.bundle.js"></script>
<script src="src/markdown.js"></script>
<script src="src/table-editor.js"></script>
<script src="src/live-preview.js"></script>
<script src="src/app.js"></script>
</body>
</html>
